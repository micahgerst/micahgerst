site_name: micah gerstner
site_author: Micah Gerstner
site_description: null
copyright: (c) Micah Gerstner, 2026

nav:
  - home: 'index.md'
  - projects: 'projects.md'

docs_dir: src/

theme: 
  name: landing
  locale: en

  # header options
  header_layout:
    - avatar
    - nav
    - title
    - tagline
    - socials
  
  tagline: "he/they | [ma&#618;k&#601; g&#601rstn&#601r](https://ipa-reader.com/?text=ma%C9%AA.k%C9%99%20g%C9%99rstn%C9%99r&voice=Joey)"
  socials:
    - label: GitHub
      link: https://github.com/micahgerst
      icon: [brands, github]
    - label: LinkedIn
      link: https://www.linkedin.com/in/micah-gerstner/
      icon: [brands,linkedin]

  # content box options
  border_left: 2px solid var(--tertiary)
  content_box_opacity: 0.2

  # images
  # Tiny Bold Color Cards icon by Icons8
  favicon: img/icons8-cards-16.png
  avatar: img/profile_picture.png

  toc_level: 2

  # style options
  background_gradient_colors: 
    - color-mix(in srgb, var(--crust) 100%, transparent)
    - transparent
    - color-mix(in srgb, var(--base) 80%, transparent)
  round_avatar: True

  # colours
  primary_color: "#7287fd"  
  secondary_color: "#179299"
  tertiary_color: "#fe640b"
  # shades
  base_color: "#eff1f5"
  mantle_color: "#e6e9ef"
  crust_color: "#dce0e8"
  overlay_color: "#4c4f69"
  # text
  text_color: "#4c4f69"
  hltext_color: var(--base)
  # background-specific text
  primary_text_color: var(--hltext)
  secondary_text_color: var(--hltext)
  tertiary_text_color: var(--hltext)
  base_text_color: var(--text)
  mantle_text_color: var(--text)
  crust_text_color: var(--text)
  overlay_text_color: var(--hltext)

  # colours (dark)
  primary_color_dark: "#94e2d5"  #teal
  secondary_color_dark: "#cba6f7" #mauve
  tertiary_color_dark: "#b4befe"  #lavender
  # shades (dark)
  base_color_dark: "#1e1e2e"
  mantle_color_dark: "#181825"
  crust_color_dark: "#11111b"
  overlay_color_dark: "#6c7086"
  # text (dark)
  text_color_dark: "#cdd6f4"
  hltext_color_dark: var(--base)
  # background-specific text (dark)
  primary_text_color_dark: "#11111b"
  secondary_text_color_dark: var(--text)
  tertiary_text_color_dark: var(--text)
  base_text_color_dark: var(--text)
  mantle_text_color_dark: var(--text)
  crust_text_color_dark: var(--text)
  overlay_text_color_dark: var(--hltext)

  # fonts
  heading_font: Noto Sans
  body_font: Noto Sans
  mono_font: Roboto Mono

  # other options
  share_btn: False

# css modifications
extra_css:
  - style.css
